<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Mirrors src/components/Logo.tsx. A favicon can't inherit the page's
       colours, so the ink is restated here and swapped for dark browser UI. -->
  <style>
    .arrived { fill: #21201f }
    .lead { fill: #348457 }
    @media (prefers-color-scheme: dark) {
      .arrived { fill: #f6f4f2 }
      .lead { fill: #60bc85 }
    }
  </style>
  <rect class="arrived" x="0"    y="0"    width="7" height="7" rx="2"/>
  <rect class="arrived" x="8.5"  y="0"    width="7" height="7" rx="2"/>
  <rect class="arrived" x="0"    y="8.5"  width="7" height="7" rx="2"/>
  <rect class="lead"    x="17"   y="8.5"  width="7" height="7" rx="2"/>
  <rect class="arrived" x="8.5"  y="17"   width="7" height="7" rx="2"/>
  <rect class="arrived" x="17"   y="17"   width="7" height="7" rx="2"/>
</svg>
